apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: canary-rollout
  namespace: production
spec:
  engineState: active
  chaosServiceAccount: litmus-admin
  annotationCheck: "true"
  appinfo:
    appns: production
    applabel: app=web-frontend
    appkind: deployment
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "30"
            - name: CHAOS_INTERVAL
              value: "5"
            - name: FORCE
              value: "true"
            - name: TARGET_PODS
              value: ""
    - name: pod-network-latency
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "30"
            - name: NETWORK_LATENCY
              value: "1000"
            - name: JITTER
              value: "200"
            - name: TARGET_PODS
              value: ""
