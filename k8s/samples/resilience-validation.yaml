apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: resilience-validation
  namespace: staging
spec:
  engineState: active
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: CHAOS_INTERVAL
              value: "15"
            - name: FORCE
              value: "true"
            - name: TARGET_PODS
              value: ""
    - name: pod-cpu-hog
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: CPU_CORES
              value: "2"
            - name: CPU_LOAD
              value: "80"
            - name: TARGET_PODS
              value: ""
    - name: pod-memory-hog
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: MEMORY_CONSUMPTION
              value: "1000"
            - name: MEMORY_PERCENTAGE
              value: "90"
