[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "chaos-toolkit"
version = "0.1.0"
description = "CLI for managing LitmusChaos experiments on Kubernetes"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "kubernetes>=27.0",
    "rich>=13.0",
    "httpx>=0.25",
    "tabulate>=0.9",
]

[project.scripts]
chaos = "chaos_toolkit.main:cli"

[tool.setuptools.packages.find]
include = ["chaos_toolkit*"]
